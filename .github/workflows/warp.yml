name: Generate WARP SubscriptionV3

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate V2Ray Subscription
        run: |
          mkdir -p public
          
          # ================= 请在这里填入你获取到的专属信息 =================
          PRIV_KEY="UENZ8NpT1Nuh/PtKjhBcjorImzOkPGzl4/DKUwRfhns="
          IPV4="172.16.0.2"
          IPV6="2606:4700:110:8596:26a0:cfb0:c417:1b63"
          # ================================================================

          cat <<EOF > generate_v2ray.py
          import base64
          import urllib.parse
          
          priv_key = "$PRIV_KEY"
          ipv4 = "$IPV4/32"
          ipv6 = "$IPV6/128"
          pub_key = "bmXOC+F1JyAwbTOftA8uF264Nwg13U97Bf2y6F73k3U="
          
          # 加上 safe='' 强制对所有特殊字符（如斜杠/、加号+等）进行安全转义
          address_enc = urllib.parse.quote(f"{ipv4},{ipv6}", safe='')
          pub_enc = urllib.parse.quote(pub_key, safe='')
          priv_enc = urllib.parse.quote(priv_key, safe='')
          
          endpoints = [
              ("WARP-2408", "162.159.192.1", 2408),
              ("WARP-1701", "162.159.193.10", 1701),
              ("WARP-500", "188.114.96.1", 500)
          ]
          
          nodes = []
          for name, ip, port in endpoints:
              name_enc = urllib.parse.quote(name, safe='')
              url = f"wireguard://{priv_enc}@{ip}:{port}/?publickey={pub_enc}&address={address_enc}&mtu=1280#{name_enc}"
              nodes.append(url)
              
          b64_content = base64.b64encode("\n".join(nodes).encode('utf-8')).decode('utf-8')
          
          with open("public/v2ray.txt", "w") as f:
              f.write(b64_content)
          EOF
          
          python3 generate_v2ray.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
