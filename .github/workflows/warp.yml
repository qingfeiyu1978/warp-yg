name: Generate WARP SubscriptionV3

on:
  schedule:
    - cron: '0 20 * * *'  # 北京时间每天早晨 04:00 自动运行
  workflow_dispatch:       # 支持手动点击按钮运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install wgcf & Generate Config
        run: |
          mkdir -p public

          # 1. 下载官方最新 wgcf 工具
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf

          # 2. 注册 WARP 账号并生成配置 (注意这里修正为 --accept-tos)
          ./wgcf register --accept-tos
          ./wgcf generate

          # 3. 提取 Key 和 IP 变量
          PRIV_KEY=$(grep 'PrivateKey' wgcf-profile.ini | awk -F '= ' '{print $2}')
          IPV4=$(grep 'Address' wgcf-profile.ini | head -n 1 | awk -F '= ' '{print $2}' | cut -d '/' -f 1)
          IPV6=$(grep 'Address' wgcf-profile.ini | tail -n 1 | awk -F '= ' '{print $2}' | cut -d '/' -f 1)

          # 4. 生成 Clash YAML 配置
          cat <<EOF > public/clash.yaml
          proxies:
            - name: "WARP-Endpoint-1"
              type: WireGuard
              server: 162.159.192.1
              port: 2408
              ip: "$IPV4"
              ipv6: "$IPV6"
              private-key: "$PRIV_KEY"
              public-key: "bmXOC+F1JyAwbTOftA8uF264Nwg13U97Bf2y6F73k3U="
              udp: true
              remote-dns-resolve: true

            - name: "WARP-Endpoint-2"
              type: WireGuard
              server: 162.159.193.10
              port: 1701
              ip: "$IPV4"
              ipv6: "$IPV6"
              private-key: "$PRIV_KEY"
              public-key: "bmXOC+F1JyAwbTOftA8uF264Nwg13U97Bf2y6F73k3U="
              udp: true
              remote-dns-resolve: true

            - name: "WARP-Endpoint-3"
              type: WireGuard
              server: 188.114.96.1
              port: 500
              ip: "$IPV4"
              ipv6: "$IPV6"
              private-key: "$PRIV_KEY"
              public-key: "bmXOC+F1JyAwbTOftA8uF264Nwg13U97Bf2y6F73k3U="
              udp: true
              remote-dns-resolve: true
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
