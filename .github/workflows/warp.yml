name: Generate WARP Subscription

on:
  schedule:
    - cron: '0 20 * * *'  # 北京时间每天早晨 04:00 自动运行
  workflow_dispatch:       # 支持在 GitHub 界面手动点按钮运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests pyyaml

      - name: Generate WARP Config
        run: |
          # 建立输出目录
          mkdir -p public

          # 调用注册 API 获取 WARP 账号参数并生成 Clash 格式节点
          python -c '
          import requests, json, os

          # 1. 注册 WARP 账号获取密钥
          url = "https://api.cloudflareclient.com/v0a1922/reg"
          headers = {"User-Agent": "okhttp/3.12.1", "Content-Type": "application/json"}
          res = requests.post(url, headers=headers, json={}).json()

          privkey = res["config"]["peers"][0]["public_key"] # 此处可搭配 wgcf 生成私钥
          ipv4 = res["config"]["interface"]["addresses"]["v4"]
          ipv6 = res["config"]["interface"]["addresses"]["v6"]

          # 2. 预设国内三网常用的 Endpoint IP 池
          endpoints = [
            "162.159.192.1:2408",
            "162.159.193.10:1701",
            "188.114.96.1:500",
            "188.114.97.1:1701",
            "162.159.195.1:500"
          ]

          # 生成配置输出 (Clash/Mihomo 样例)
          yaml_content = f"""
          proxies:
          """
          for i, ep in enumerate(endpoints):
              ip, port = ep.split(":")
              yaml_content += f"""
            - name: "WARP-Node-{i+1}"
              type: WireGuard
              server: {ip}
              port: {port}
              ip: "{ipv4}"
              ipv6: "{ipv6}"
              private-key: "YOUR_GENERATED_PRIVATE_KEY"
              public-key: "bmXOC+F1JyAwbTOftA8uF264Nwg13U97Bf2y6F73k3U="
              udp: true
              remote-dns-resolve: true
          """
          with open("public/clash.yaml", "w", encoding="utf-8") as f:
              f.write(yaml_content)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
